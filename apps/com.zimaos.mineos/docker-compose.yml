name: mineos-node
services:
  mineos:
    image: hexparrot/mineos:latest
    container_name: mineos_server
    networks:
      - mineos
    restart: unless-stopped
    stop_grace_period: 10m
    volumes:
      - /var/games/mineos/minecraft:/var/games/minecraft
    environment:
      USE_HTTPS: "true"
      SERVER_PORT: 8443
      USER_NAME: mc
      USER_UID: 1000
      USER_PASSWORD: root
    ports:
      - 8444:8443/tcp
      - 25565-25570:25565-25570/tcp
      - 25565-25570:25565-25570/udp
volumes:
  mineos_data:
networks:
  mineos:
x-casaos:
  main: mineos
  icon: https://cdn.jsdelivr.net/gh/futuroatom/ZimaOS-Apps@gh-pages/apps/com.zimaos.mineos/assets/icon.png
  title:
    en_US: MineOS
  index: /admin/index.html
  scheme: https
  port_map: "8444"
  id: com.zimaos.mineos
