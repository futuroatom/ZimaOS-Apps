name: threadfin
services:
  threadfin:
    image: fyb3roptik/threadfin:latest
    restart: unless-stopped
    environment:
      - THREADFIN_BRANCH=main
      - THREADFIN_DEBUG=0
    ports:
      - target: 34400
        published: "34400"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/threadfin/config
        target: /home/threadfin/conf/data
      - type: bind
        source: /DATA/AppData/threadfin/backup
        target: /home/threadfin/conf/backup
    container_name: threadfin
x-casaos:
  main: threadfin
  icon: https://cdn.jsdelivr.net/gh/futuroatom/ZimaOS-Apps@gh-pages/apps/com.zimaos.threadfin/assets/icon.png
  index: /web/
  port_map: "34400"
  scheme: http
  title:
    en_US: Threadfin
    zh_CN: Threadfin
  id: com.zimaos.threadfin
