name: vocechat
services:
  vocechat:
    environment:
      TZ: $TZ
    image: privoce/vocechat-server:v0.4.0@sha256:b97b87746680fb382251f327181405fb5e3f73eeb122ad31ca334db5fa58f48d
    deploy:
      resources:
        reservations:
          memory: 64M
    network_mode: bridge
    ports:
      - target: 3000
        published: "3009"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/home/vocechat-server/data
        target: /home/vocechat-server/data
    container_name: vocechat
x-casaos:
  main: vocechat
  icon: https://cdn.jsdelivr.net/gh/futuroatom/ZimaOS-Apps@gh-pages/apps/com.zimaos.vocechat/assets/icon.png
  title:
    en_US: VoceChat
  index: /
  port_map: "3009"
  id: com.zimaos.vocechat
