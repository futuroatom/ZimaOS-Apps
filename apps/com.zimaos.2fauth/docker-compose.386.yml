name: 2fauth
services:
  2fauth:
    image: 2fauth/2fauth:5.4.3@sha256:2d47132ff77c255b893328e6140f9df4d1ff5ade863a7d78609864490decfc0f
    deploy:
      resources:
        reservations:
          memory: 64M
    network_mode: bridge
    ports:
      - target: 8000
        published: "8000"
        protocol: tcp
    restart: always
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID
        target: /2fauth
    container_name: 2fauth
x-casaos:
  main: 2fauth
  icon: https://cdn.jsdelivr.net/gh/futuroatom/ZimaOS-Apps@gh-pages/apps/com.zimaos.2fauth/assets/icon.png
  title:
    en_US: 2FAuth
  index: /
  port_map: "8000"
  id: com.zimaos.2fauth
