name: siyuan-note
services:
  siyuan-note:
    command: "--accessAuthCode=casaos --workspace=/siyuan/workspace/"
    environment:
      PUID: "1000"
      PGID: "1000"
    image: b3log/siyuan:v3.1.18@sha256:ce804fe9214fc0a249507bb29e1c5b66c14d9f721f9161107561bbe96f263a85
    deploy:
      resources:
        reservations:
          memory: 512M
    network_mode: bridge
    ports:
      - target: 6806
        published: "6806"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/workspace
        target: /siyuan/workspace
    container_name: siyuan-note
x-casaos:
  main: siyuan-note
  icon: https://cdn.jsdelivr.net/gh/futuroatom/ZimaOS-Apps@gh-pages/apps/com.zimaos.siyuan-note/assets/icon.png
  title:
    en_US: SiYuan Note
    zh_CN: 思源笔记
  index:
  port_map: "6806"
  id: com.zimaos.siyuan-note
