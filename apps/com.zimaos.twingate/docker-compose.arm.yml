name: twingate-connector
services:
  twingate-connector:
    image: twingate/connector:1.73.0@sha256:d347c8e27c3e57869c69bc15bc528baf02c30ef70516feeddcc992784123655b
    container_name: twingate-connector
    command:
      - /connectord
    environment:
      TWINGATE_NETWORK: ""
      TWINGATE_ACCESS_TOKEN: ""
      TWINGATE_REFRESH_TOKEN: ""
      TWINGATE_LABEL_HOSTNAME: ${HOSTNAME}
    restart: unless-stopped
    sysctls:
      net.ipv4.ping_group_range: 0 2147483647
    network_mode: default
    privileged: false
    cpu_shares: 90
    deploy:
      resources:
        reservations:
          memory: 500M
x-casaos:
  main: twingate-connector
  icon: https://cdn.jsdelivr.net/gh/futuroatom/ZimaOS-Apps@gh-pages/apps/com.zimaos.twingate/assets/icon.png
  title:
    en_US: Twingate
  index: /
  port_map: ""
  id: com.zimaos.twingate
