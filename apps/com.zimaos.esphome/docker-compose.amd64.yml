name: esphome
services:
  esphome:
    container_name: esphome
    deploy:
      resources:
        reservations:
          memory: 512M
    image: ghcr.io/esphome/esphome@sha256:ce313b07edc3d0bde937ce23821b5e0476dcc1cfb62456bef7a6f79b8109f678
    restart: always
    ports:
      - target: 6052
        published: "6052"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    environment:
      ESPHOME_DASHBOARD_USE_PING: "false"
      TZ: $TZ
    network_mode: host
    privileged: false
x-casaos:
  icon: https://cdn.jsdelivr.net/gh/futuroatom/ZimaOS-Apps@gh-pages/apps/com.zimaos.esphome/assets/icon.png
  index: /
  main: esphome
  port_map: "6052"
  scheme: http
  title:
    en_US: ESPHome
  id: com.zimaos.esphome
