name: nginxproxymanager
services:
  nginxproxymanager:
    image: jc21/nginx-proxy-manager:2.12.2@sha256:ae083ba8caec991a6cfbd0bfbf4822bc0c1cb30d23a3055c71901dd7341a8dcd
    deploy:
      resources:
        reservations:
          memory: 128M
    network_mode: bridge
    ports:
      - target: 80
        published: "80"
        protocol: tcp
      - target: 443
        published: "443"
        protocol: tcp
      - target: 81
        published: "81"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /data
      - type: bind
        source: /DATA/AppData/$AppID/etc/letsencrypt
        target: /etc/letsencrypt
    container_name: nginxproxymanager
x-casaos:
  main: nginxproxymanager
  icon: https://cdn.jsdelivr.net/gh/futuroatom/ZimaOS-Apps@gh-pages/apps/com.zimaos.nginxproxymanager/assets/icon.png
  title:
    en_US: Nginx Proxy Manager
    zh_CN: Nginx 代理管理器
  index: /
  port_map: "81"
  id: com.zimaos.nginxproxymanager
