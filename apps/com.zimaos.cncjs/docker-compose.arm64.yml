version: "3.7"
name: cncjs
services:
  cncjs:
    container_name: CNCjs
    image: cncjs/cncjs:latest@sha256:ecfbfde8d5af6dd0497a6f46d0a0af64f9a22125866f62f07cf3fd1fe0ee05bd
    ports:
      - "8005:8000"
    volumes:
      - /DATA/AppData/CNCjs:/cncjs
    network_mode: bridge
    hostname: cncjs
    restart: unless-stopped
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
    # CasaOS specific configuration for volume and port descriptions
x-casaos:
  main: CNCjs
  icon: https://cdn.jsdelivr.net/gh/futuroatom/ZimaOS-Apps@gh-pages/apps/com.zimaos.cncjs/assets/icon.png
  title:
    en_US: CNCjs
  port_map: "8000"
  scheme: http
  index: /
  id: com.zimaos.cncjs
