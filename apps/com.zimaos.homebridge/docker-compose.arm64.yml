name: homebridge
version: "2"
services:
  homebridge:
    image: homebridge/homebridge:latest@sha256:fb58d3b832b286b7c8469a12c4cb671e126d186418782a1fc98f9998065de402
    restart: always
    network_mode: host
    volumes:
      - /DATA/AppData/$AppID/config:/homebridge
    logging:
      driver: json-file
      options:
        max-size: 10mb
        max-file: "1"
x-casaos:
  main: homebridge
  icon: https://cdn.jsdelivr.net/gh/futuroatom/ZimaOS-Apps@gh-pages/apps/com.zimaos.homebridge/assets/icon.png
  title:
    en_US: Homebridge
  index: /
  port_map: "8581"
  id: com.zimaos.homebridge
