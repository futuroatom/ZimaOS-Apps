name: pyload
services:
  pyload:
    container_name: pyload
    image: linuxserver/pyload-ng:0.5.0@sha256:973dd6100df3a197ddf3ee51b0cf74411b47c882aedfbf53d864830a657aaa2f
    deploy:
      resources:
        reservations:
          memory: 256M
    environment:
      PGID: $PGID
      PUID: $PUID
      TZ: $TZ
    restart: unless-stopped
    network_mode: bridge
    privileged: false
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/Downloads
        target: /downloads
    ports:
      - target: 8000
        published: "8000"
        protocol: tcp
      - target: 9666
        published: "9666"
        protocol: tcp
x-casaos:
  main: pyload
  icon: https://cdn.jsdelivr.net/gh/futuroatom/ZimaOS-Apps@gh-pages/apps/com.zimaos.pyload/assets/icon.png
  title:
    en_US: PyLoad
    zh_CN: PyLoad
    pt_BR: PyLoad
  index: /
  port_map: "8000"
  id: com.zimaos.pyload
