name: ddns-go
services:
  ddns-go:
    image: jeessy/ddns-go:v6.7.7@sha256:0ddbc17f3f0cdbb5f2dc64db2fea11b48e7638fb1bc9c54e9321240d76f046a2
    network_mode: bridge
    deploy:
      resources:
        reservations:
          memory: 32M
    restart: unless-stopped
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /root
    ports:
      - target: 9876
        published: "9876"
        protocol: tcp
    container_name: ddns-go
x-casaos:
  icon: https://cdn.jsdelivr.net/gh/futuroatom/ZimaOS-Apps@gh-pages/apps/com.zimaos.ddns-go/assets/icon.png
  main: ddns-go
  port_map: "9876"
  scheme: http
  title:
    en_US: ddns-go
  id: com.zimaos.ddns-go
