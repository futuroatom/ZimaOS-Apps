name: ddns-go
services:
  ddns-go:
    image: jeessy/ddns-go:v6.7.7@sha256:8a9f90497b84e46792fd66b42584d09f789687ea22654f27e38fa421403f7c30
    network_mode: bridge
    deploy:
      resources:
        reservations:
          memory: 32M
    restart: unless-stopped
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /root
    ports:
      - target: 9876
        published: "9876"
        protocol: tcp
    container_name: ddns-go
x-casaos:
  icon: https://cdn.jsdelivr.net/gh/futuroatom/ZimaOS-Apps@gh-pages/apps/com.zimaos.ddns-go/assets/icon.png
  main: ddns-go
  port_map: "9876"
  scheme: http
  title:
    en_US: ddns-go
  id: com.zimaos.ddns-go
