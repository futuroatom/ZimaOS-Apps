version: "3.8"
name: anythingllm
services:
  anythingllm:
    image: mintplexlabs/anythingllm:undefined
    container_name: anythingllm
    ports:
      - target: 3001
        published: 3051
        protocol: tcp
    cap_add:
      - SYS_ADMIN
    volumes:
      - type: bind
        source: /DATA/AppData/anythingllm/storage
        target: /app/server/storage
    restart: always
    extra_hosts:
      - host.docker.internal:host-gateway
x-casaos:
  main: anythingllm
  icon: https://cdn.jsdelivr.net/gh/futuroatom/ZimaOS-Apps@gh-pages/apps/com.zimaos.anyingllm/assets/icon.png
  scheme: http
  title:
    en_US: AnythingLLM
    en_UK: AnythingLLM
    zh_CN: AnythingLLM
    ja_JP: AnythingLLM
  index: /
  port_map: "3051"
  id: com.zimaos.anyingllm
