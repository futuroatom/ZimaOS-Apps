name: vaultwarden
services:
  vaultwarden:
    image: vaultwarden/server:1.32.7
    deploy:
      resources:
        reservations:
          memory: 256M
    network_mode: bridge
    ports:
      - target: 80
        published: "10380"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /data
    container_name: vaultwarden
x-casaos:
  main: vaultwarden
  icon: https://cdn.jsdelivr.net/gh/futuroatom/ZimaOS-Apps@gh-pages/apps/com.zimaos.vaultwarden/assets/icon.png
  title:
    en_US: Vaultwarden
  index: /
  port_map: "10380"
  id: com.zimaos.vaultwarden
