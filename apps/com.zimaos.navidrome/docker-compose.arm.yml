name: navidrome
services:
  navidrome:
    container_name: navidrome
    deploy:
      resources:
        reservations:
          memory: 1024M
    image: deluan/navidrome:0.54.3@sha256:34b28a4654db082e1b8df6ac37f85c69af03750c063f2ec51752433a5320d3e4
    restart: unless-stopped
    ports:
      - target: 4533
        published: "4533"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /data
      - type: bind
        source: /DATA/Media/Music
        target: /music
    environment:
      ND_SCANSCHEDULE: 1h
      ND_LOGLEVEL: info
      ND_SESSIONTIMEOUT: 24h
      ND_BASEURL: ""
      TZ: $TZ
    network_mode: bridge
    privileged: false
x-casaos:
  icon: https://cdn.jsdelivr.net/gh/futuroatom/ZimaOS-Apps@gh-pages/apps/com.zimaos.navidrome/assets/icon.png
  index: /
  main: navidrome
  port_map: "4533"
  scheme: http
  title:
    en_US: Navidrome
  id: com.zimaos.navidrome
