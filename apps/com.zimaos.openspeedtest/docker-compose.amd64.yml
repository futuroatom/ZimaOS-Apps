name: openspeedtest
services:
  openspeedtest:
    image: openspeedtest/latest:v2.0.5@sha256:3e610c8f445e901252b92c498ff061d5762a3db4ecb499565909eaa8000a6e3a
    deploy:
      resources:
        reservations:
          memory: 64M
    network_mode: bridge
    ports:
      - target: 3000
        published: "3004"
        protocol: tcp
    restart: always
    container_name: openspeedtest
x-casaos:
  main: openspeedtest
  icon: https://cdn.jsdelivr.net/gh/futuroatom/ZimaOS-Apps@gh-pages/apps/com.zimaos.openspeedtest/assets/icon.png
  title:
    en_US: OpenSpeedTest
  index: /
  port_map: "3004"
  id: com.zimaos.openspeedtest
