name: handbrake
services:
  handbrake:
    image: jlesage/handbrake:v24.12.1@sha256:aa9786d715b0957f6960fad2e98f4781d934f71b18621cc116072db56e49b8aa
    network_mode: bridge
    ports:
      - target: 5800
        published: "5800"
        protocol: tcp
    privileged: true
    restart: unless-stopped
    volumes:
      - type: bind
        source: /DATA
        target: /storage
      - type: bind
        source: /DATA/AppData/$AppID/watch
        target: /watch
      - type: bind
        source: /DATA/Media
        target: /output
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    container_name: handbrake
x-casaos:
  icon: https://cdn.jsdelivr.net/gh/futuroatom/ZimaOS-Apps@gh-pages/apps/com.zimaos.handbrake/assets/icon.png
  index: /
  port_map: "5800"
  scheme: http
  title:
    en_US: handbrake
  id: com.zimaos.handbrake
