name: open-webui-ollama
services:
  open-webui-ollama:
    image: ghcr.io/open-webui/open-webui@sha256:e8c591138f32d75d8b7f2b87985dd7b47254177a30269566abe565cf0ef20a4f
    runtime: nvidia
    ipc: host
    environment:
      CPU_FALLBACK: "true"
      NVIDIA_VISIBLE_DEVICES: all
    deploy:
      resources:
        reservations:
          memory: 512M
    network_mode: bridge
    ports:
      - target: 8080
        published: "3050"
        protocol: tcp
    restart: always
    volumes:
      - type: bind
        source: /DATA/AppData/open-webui-ollama/open-webui
        target: /app/backend/data
      - type: bind
        source: /DATA/AppData/open-webui-ollama/ollama
        target: /root/.ollama
    privileged: false
    container_name: open-webui-ollama
x-casaos:
  main: open-webui-ollama
  icon: https://cdn.jsdelivr.net/gh/futuroatom/ZimaOS-Apps@gh-pages/apps/com.zimaos.openwebui/assets/icon.png
  scheme: http
  title:
    en_US: Open WebUI
    en_UK: Open WebUI
    zh_CN: Open WebUI
    ja_JP: Open WebUI
  index: /
  port_map: "3050"
  id: com.zimaos.openwebui
