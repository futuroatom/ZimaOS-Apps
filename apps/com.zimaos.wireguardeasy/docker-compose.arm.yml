name: wg-easy
services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy@sha256:66352ccb4b5095992550aa567df5118a5152b6ed31be34b0a8e118a3c3a35bf5
    restart: unless-stopped
    network_mode: bridge
    environment:
      PASSWORD: casaos
      WG_HOST: casaos.local
      WG_PORT: "51820"
      WG_DEFAULT_DNS: 1.1.1.1
    ports:
      - target: 51820
        published: "51820"
        protocol: udp
      - target: 51821
        published: "51821"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/wireguard
        target: /etc/wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    container_name: wg-easy
x-casaos:
  main: wg-easy
  icon: https://cdn.jsdelivr.net/gh/futuroatom/ZimaOS-Apps@gh-pages/apps/com.zimaos.wireguardeasy/assets/icon.png
  title:
    en_US: WireGuard Easy
  port_map: "51821"
  id: com.zimaos.wireguardeasy
