name: emby-nvidia
services:
  emby:
    devices:
      - /dev/dri:/dev/dri
      - /dev/vchiq:/dev/vchiq
      - /dev/video10:/dev/video10
      - /dev/video11:/dev/video11
      - /dev/video12:/dev/video12
    environment:
      PGID: "1000"
      PUID: "1000"
      TZ: $TZ
      CPU_FALLBACK: "true"
      NVIDIA_VISIBLE_DEVICES: all
    image: linuxserver/emby:4.8.10@sha256:b0fca9b7decc270e222eff7a64537d2f9259955fad10e6f160ecb1f387b51419
    deploy:
      resources:
        reservations:
          memory: 256M
          devices:
            - capabilities:
                - gpu
    network_mode: bridge
    ports:
      - target: 8096
        published: "8096"
        protocol: tcp
      - target: 8920
        published: "8920"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/Media/TV Shows
        target: /data/tvshows
      - type: bind
        source: /DATA/Media/Movies
        target: /data/movies
    container_name: emby
x-casaos:
  main: emby
  icon: https://cdn.jsdelivr.net/gh/futuroatom/ZimaOS-Apps@gh-pages/apps/com.zimaos.emby-nvidia/assets/icon.png
  title:
    en_US: Emby(Nvidia GPU)
  index: /
  port_map: "8096"
  id: com.zimaos.emby-nvidia
