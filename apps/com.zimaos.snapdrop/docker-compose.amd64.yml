name: snapdrop
services:
  snapdrop:
    environment:
      - PGID=$PGID
      - PUID=$PUID
      - TZ=$TZ
    image: linuxserver/snapdrop:version-eac78009@sha256:12e359db1dd3857e723031ead2732e38356c20ce97bb246fdcd16c2b87bde6fd
    network_mode: bridge
    ports:
      - target: 443
        published: "443"
        protocol: tcp
      - target: 80
        published: "89"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    privileged: false
    container_name: snapdrop
x-casaos:
  icon: https://cdn.jsdelivr.net/gh/futuroatom/ZimaOS-Apps@gh-pages/apps/com.zimaos.snapdrop/assets/icon.png
  index: /
  port_map: "89"
  scheme: http
  title:
    en_US: snapdrop
  id: com.zimaos.snapdrop
