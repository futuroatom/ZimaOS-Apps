name: plex-nvidia
services:
  plex:
    devices:
      - /dev/dri:/dev/dri
      - /dev/dvb:/dev/dvb
    environment:
      PGID: $PGID
      PUID: $PUID
      VERSION: docker
      CPU_FALLBACK: "true"
      NVIDIA_VISIBLE_DEVICES: all
    image: lscr.io/linuxserver/plex:1.41.3@sha256:3a9097b826c8cad2213923bf07a30c677a27b564b7df479b474e328f6e145837
    deploy:
      resources:
        reservations:
          memory: 256M
          devices:
            - capabilities:
                - gpu
    network_mode: host
    restart: unless-stopped
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/Media
        target: /Media
    container_name: plex
x-casaos:
  main: plex
  icon: https://cdn.jsdelivr.net/gh/futuroatom/ZimaOS-Apps@gh-pages/apps/com.zimaos.plex-nvidia/assets/icon.png
  title:
    en_US: Plex(Nvidia GPU)
  index: /web/index.html
  port_map: "32400"
  id: com.zimaos.plex-nvidia
