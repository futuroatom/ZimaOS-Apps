name: motioneye
services:
  motioneye:
    container_name: motioneye
    image: ccrisan/motioneye:master-amd64@sha256:1704cddc44e0bc7e1c4aff9f1f6546127584e8351c04a0faa1d46c7fb791180b
    ports:
      - target: 8765
        published: "8765"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: bind
        source: /DATA/AppData/motioneye/config
        target: /etc/motioneye
      - type: bind
        source: /DATA/Media/motioneye
        target: /var/lib/motioneye
    network_mode: bridge
    privileged: false
x-casaos:
  icon: https://cdn.jsdelivr.net/gh/futuroatom/ZimaOS-Apps@gh-pages/apps/com.zimaos.motioneye/assets/icon.png
  index: /
  main: motioneye
  port_map: "8765"
  scheme: http
  title:
    en_US: Motioneye
  id: com.zimaos.motioneye
